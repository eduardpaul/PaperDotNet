# Optional: run PaperDotNet on PostgreSQL instead of SQLite.
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.postgres.yml up -d
services:
  postgres:
    # pgvector image: plain PostgreSQL 17 today, ready for semantic search later.
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: paperdotnet
      POSTGRES_USER: paperdotnet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperdotnet -d paperdotnet"]
      interval: 10s
      timeout: 5s
      retries: 5

  paperdotnet:
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PAPERDOTNET__Database__Provider: PostgreSql
      PAPERDOTNET__ConnectionStrings__PaperDotNet: "Host=postgres;Database=paperdotnet;Username=paperdotnet;Password=${POSTGRES_PASSWORD}"

volumes:
  postgres-data:
