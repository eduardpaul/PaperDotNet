# Optional: run PaperDotNet on PostgreSQL instead of SQLite.
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.postgres.yml up -d
services:
  postgres:
    # pgvector image: plain PostgreSQL 17 today, ready for semantic search later.
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      # Admin account (superuser) for maintenance only; the app uses the ordinary
      # role "paperdotnet" created by postgres-init, so row-level security applies.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD in .env}
      APP_DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d paperdotnet"]
      interval: 10s
      timeout: 5s
      retries: 5

  paperdotnet:
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PAPERDOTNET__Database__Provider: PostgreSql
      PAPERDOTNET__ConnectionStrings__PaperDotNet: "Host=postgres;Database=paperdotnet;Username=paperdotnet;Password=${POSTGRES_PASSWORD}"

volumes:
  postgres-data:
