# Minimal self-hosted PaperDotNet: ONE container, data in SQLite on a volume.
#   cp deploy/.env.example deploy/.env   # then set the secrets
#   docker compose -f deploy/docker-compose.yml up -d
# The server is one Native AOT binary (ADR-0039). PostgreSQL (docker-compose.postgres.yml) needs its own build of the
# server and comes back when that build exists.
name: paperdotnet

services:
  paperdotnet:
    image: ${PAPERDOTNET_IMAGE:-paperdotnet:local}
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${PAPERDOTNET_PORT:-8080}:8080"
    environment:
      # The first administrator (user name admin) is created with this password on first start.
      PAPERDOTNET__Bootstrap__AdminPassword: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      PAPERDOTNET__Tenancy__DefaultTenant: ${DEFAULT_TENANT:-default}
      PAPERDOTNET__Bootstrap__TenantIdentifier: ${DEFAULT_TENANT:-default}
    volumes:
      # SQLite database and Data Protection keys.
      - paperdotnet-data:/data

volumes:
  paperdotnet-data:
