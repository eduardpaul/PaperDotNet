# Minimal self-hosted PaperDotNet: ONE container, data in SQLite on a volume.
#   cp deploy/.env.example deploy/.env   # then set the secrets
#   docker compose -f deploy/docker-compose.yml up -d
# To use PostgreSQL instead, add the override file:
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.postgres.yml up -d
name: paperdotnet

services:
  paperdotnet:
    image: ${PAPERDOTNET_IMAGE:-paperdotnet:local}
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${PAPERDOTNET_PORT:-8080}:8080"
    environment:
      PAPERDOTNET__Auth__SigningKey: ${SIGNING_KEY:?set SIGNING_KEY (32+ chars) in .env}
      PAPERDOTNET__Bootstrap__AdminPassword: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      PAPERDOTNET__Tenancy__DefaultTenant: ${DEFAULT_TENANT:-default}
      # Set to true when running behind a reverse proxy (Traefik, Caddy, nginx).
      PAPERDOTNET__ForwardedHeaders__Enabled: ${BEHIND_PROXY:-false}
    volumes:
      # SQLite database and (from phase 3) stored files.
      - paperdotnet-data:/data

volumes:
  paperdotnet-data:
