name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Everything must work on both databases (ADR-0009).
        provider: [sqlite, postgresql]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: |
          dotnet restore PaperDotNet.slnx
          dotnet tool restore

      - name: Verify compiled message handlers
        run: |
          dotnet run --project src/PaperDotNet.Host --no-launch-profile -- codegen write
          git diff --exit-code -- src/PaperDotNet.Host/Internal/Generated
          if [ -n "$(git ls-files --others --exclude-standard -- src/PaperDotNet.Host/Internal/Generated)" ]; then
            echo "New generated message handlers must be committed."
            exit 1
          fi
          dotnet restore PaperDotNet.slnx -p:Configuration=Release

      - name: Format
        run: dotnet format PaperDotNet.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build PaperDotNet.slnx -c Release --no-restore

      - name: Migrations match the model
        run: |
          for project in PostgreSql Sqlite; do
            for context in TenancyDbContext IdentityDbContext WorkspacesDbContext ListsDbContext JobsDbContext TaxonomyDbContext SearchDbContext ExtensionsDbContext; do
              dotnet ef migrations has-pending-model-changes \
                -p "src/Migrations/PaperDotNet.Migrations.$project" -c "$context" --configuration Release --no-build
            done
          done

      # OCR (DOC-07) as in the Dockerfile; backups (PLT-12) need pg_dump at least as new as the server (postgres:17).
      - name: Install Tesseract and PostgreSQL client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng tesseract-ocr-deu
          if [ "${{ matrix.provider }}" = "postgresql" ]; then
            sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
            sudo apt-get install -y --no-install-recommends postgresql-client-17
            echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          fi

      # PostgreSQL runs in Testcontainers (Docker is available on the runner); SQLite uses a temp file.
      - name: Test (${{ matrix.provider }})
        env:
          PAPERDOTNET_TEST_PROVIDER: ${{ matrix.provider }}
        run: dotnet test --solution PaperDotNet.slnx -c Release --no-build

      # Validate the published process and fixture, not machine-specific throughput.
      - name: Performance harness smoke (${{ matrix.provider }})
        env:
          PERF_HOST_PATH: ${{ github.workspace }}/artifacts/performance-host/paperdotnet.dll
          PERF_OUTPUT: ${{ github.workspace }}/artifacts/performance-smoke/results.json
          PERF_P95_MS: 30000
        run: |
          dotnet publish src/PaperDotNet.Host -c Release --no-build --no-restore -o artifacts/performance-host
          dotnet tests/PaperDotNet.Performance/bin/Release/net10.0/PaperDotNet.Performance.dll ${{ matrix.provider }} --smoke --gate

      - name: Upload performance smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-smoke-${{ matrix.provider }}
          path: artifacts/performance-smoke/
          if-no-files-found: ignore

  # The web UI and the TypeScript SDK (ADR-0032, ADR-0033), against a real host on SQLite.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: |
          npm ci
          npx playwright install --with-deps chromium
          # Document screens wait for OCR (DOC-07), as in the Dockerfile.
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng tesseract-ocr-deu

      - name: Check (typecheck, lint, format, unit tests)
        run: npm run check -w web

      - name: SDK end-to-end tests
        run: npm run test:e2e -w @paperdotnet/client

      - name: UI end-to-end tests
        run: npm run test:e2e -w web

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results

  container:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t paperdotnet:ci .
