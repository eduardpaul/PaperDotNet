name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: |
          dotnet restore PaperDotNet.slnx
          dotnet tool restore

      - name: Format
        run: dotnet format PaperDotNet.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build PaperDotNet.slnx -c Release --no-restore

      - name: Migrations match the model
        run: |
          for context in TenancyDbContext IdentityDbContext WorkspacesDbContext ListsDbContext; do
            dotnet ef migrations has-pending-model-changes \
              -p src/Migrations/PaperDotNet.Migrations.PostgreSql -c "$context" --configuration Release --no-build
          done

      # Integration tests start PostgreSQL with Testcontainers (Docker is available on the runner).
      - name: Test
        run: dotnet test --solution PaperDotNet.slnx -c Release --no-build

  container:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t paperdotnet:ci .
