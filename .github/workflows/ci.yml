name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # The Native AOT server (ADR-0039) on .NET 11: build, tests, schema, and the published binary with its memory budget.
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: |
          dotnet restore PaperDotNet.slnx
          dotnet tool restore

      - name: Format
        run: dotnet format PaperDotNet.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build PaperDotNet.slnx -c Release --no-restore

      - name: Migrations match the model
        run: eng/schema.sh check

      - name: Test
        run: dotnet test --solution PaperDotNet.slnx -c Release --no-build

      - name: Native AOT publish and smoke test (memory budget)
        run: eng/aot-smoke.sh

  # The web UI and the TypeScript SDK (ADR-0032, ADR-0033). Paused: they still target the .NET 10 API, and move to the
  # AOT server (ADR-0039) with their regenerated SDK.
  web:
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: |
          npm ci
          npx playwright install --with-deps chromium
          # Document screens wait for OCR (DOC-07), as in the Dockerfile.
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng tesseract-ocr-deu

      - name: Check (typecheck, lint, format, unit tests)
        run: npm run check -w web

      - name: SDK end-to-end tests
        run: npm run test:e2e -w @paperdotnet/client

      - name: UI end-to-end tests
        run: npm run test:e2e -w web

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results

  container:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t paperdotnet:ci .
