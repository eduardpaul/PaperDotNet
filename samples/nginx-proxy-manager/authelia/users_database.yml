# Users who may sign in to PaperDotNet. No password ships with this sample: Authelia does not start until every
# user has a real hash. Create one per user:
#   docker compose run --rm authelia authelia crypto hash generate argon2
# and paste the "Digest: $argon2id$…" value (in quotes) as the password.
# Groups go to PaperDotNet as Remote-Groups: users join (and with GROUP_SYNC=Sync leave) PaperDotNet groups.
users:
  # The same name as PaperDotNet's first administrator: this user signs in as that administrator.
  admin:
    displayname: Administrator
    email: admin@example.com
    password: "SET-ME"
    groups:
      - Admins
  alice:
    displayname: Alice Example
    email: alice@example.com
    password: "SET-ME"
    groups:
      - Finance
