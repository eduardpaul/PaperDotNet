# Authelia for PaperDotNet behind Nginx Proxy Manager (compose profile "authelia").
# Host names come from .env through the template filter (X_AUTHELIA_CONFIG_FILTERS=template in compose.yml);
# the secrets come from Docker secrets (*_FILE variables).
theme: auto

server:
  address: tcp://:9091/

log:
  level: info

authentication_backend:
  file:
    path: /config/users_database.yml
    password:
      algorithm: argon2

access_control:
  default_policy: deny
  rules:
    # NPM asks Authelia only for PaperDotNet's sign-in path (npm/advanced-authelia.conf).
    - domain: '{{ env "PAPERDOTNET_HOST" }}'
      # A password and a second factor (one-time code or passkey). one_factor only for a closed network.
      policy: two_factor
      # Only members of a group may use PaperDotNet:
      # subject: 'group:paperdotnet'

# Brute force: after 3 failed sign-ins within 2 minutes, the user is banned for 15 minutes.
regulation:
  max_retries: 3
  find_time: 2m
  ban_time: 15m

# New passwords (resets) must be strong.
password_policy:
  zxcvbn:
    enabled: true
    min_score: 3

totp:
  issuer: '{{ env "PAPERDOTNET_HOST" }}'

session:
  cookies:
    - domain: '{{ env "COOKIE_DOMAIN" }}'
      authelia_url: 'https://{{ env "AUTH_HOST" }}'
      default_redirection_url: 'https://{{ env "PAPERDOTNET_HOST" }}'

storage:
  local:
    path: /var/lib/authelia/db.sqlite3

# Password-reset and two-factor registration mails land in this file
# (docker compose exec authelia cat /var/lib/authelia/notification.txt). Use an SMTP notifier for real users.
notifier:
  filesystem:
    filename: /var/lib/authelia/notification.txt
