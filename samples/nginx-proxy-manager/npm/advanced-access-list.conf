# PaperDotNet behind Nginx Proxy Manager, sign-in with an NPM access list (HTTP basic auth).
# Paste into the proxy host: Edit Proxy Host > Advanced > Custom Nginx Configuration.
# Needs npm/http_top.conf ($pdn_groups, $pdn_connect_authorization).
#
# - Replace ACCESS_LIST_ID with the id of your access list (`docker compose exec npm ls /data/access`).
# - Leave the proxy host's Access List at "Publicly Accessible". On the whole host, basic auth would take
#   the Authorization header that the web UI, the API and MCP clients need for their tokens.
# - This config has its own default location, so NPM leaves out its own (and the options it adds there).

# Sign-in (ADR-0031): the only place where PaperDotNet reads the proxy's headers, and the only place
# where the proxy asks for a password. PaperDotNet's routes ignore case and a trailing slash, so this
# location does too.
location ~* ^/connect/authorize/?$ {
    include conf.d/include/proxy.conf;
    auth_basic           "PaperDotNet";
    auth_basic_user_file /data/access/ACCESS_LIST_ID;
    # The password stays at the proxy; PaperDotNet gets the name.
    proxy_set_header Authorization "";
    proxy_set_header Remote-User   $remote_user;
    proxy_set_header Remote-Groups $pdn_groups;
    proxy_set_header Remote-Name   "";
    proxy_set_header Remote-Email  "";
}

# The other OAuth endpoints (token, userinfo, logout, revoke): no proxy identity, and without the
# access list's password that browsers send here again (npm/http_top.conf).
location ~* ^/connect/ {
    include conf.d/include/proxy.conf;
    proxy_set_header Authorization $pdn_connect_authorization;
    proxy_set_header Remote-User   "";
    proxy_set_header Remote-Groups "";
    proxy_set_header Remote-Name   "";
    proxy_set_header Remote-Email  "";
}

# Live events (server-sent events) and MCP: pass each event on at once and keep quiet streams open.
location ~* ^/v1\.0/(me/events|mcp)(/|$) {
    include conf.d/include/proxy.conf;
    proxy_buffering    off;
    proxy_cache        off;
    proxy_read_timeout 1h;
}

# Everything else: web UI, API, uploads. Requests authenticate with tokens; nobody can name a user here.
location / {
    include conf.d/include/proxy.conf;
    proxy_set_header Remote-User   "";
    proxy_set_header Remote-Groups "";
    proxy_set_header Remote-Name   "";
    proxy_set_header Remote-Email  "";
}
