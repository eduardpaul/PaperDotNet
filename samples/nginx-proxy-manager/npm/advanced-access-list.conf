# PaperDotNet behind Nginx Proxy Manager, sign-in with an NPM access list (HTTP basic auth).
# Needs npm/http_top.conf (rate limit, groups). Basic auth has no second factor: for a server on the internet,
# prefer npm/advanced-authelia.conf.
# Paste into the proxy host: Edit Proxy Host > Advanced > Custom Nginx Configuration, then replace:
# - ACCESS_LIST_ID with the id of your access list (`docker compose exec npm ls /data/access`);
# - PROXY_SECRET with PROXY_SECRET from .env.
# Leave the proxy host's Access List at "Publicly Accessible". On the whole host, basic auth would take the
# Authorization header that the web UI, the API and MCP clients need for their tokens.

# Uploads: the largest request PaperDotNet takes is a 512 MB template package (documents: 100 MB by default).
# NPM's own limit is 2000 MB; anything above this is refused before NPM buffers it to disk.
client_max_body_size 520m;

# Sign-in (ADR-0044): the only path the proxy protects. PaperDotNet sends signed-out browsers here and trusts the
# user headers only with the secret, which only this location sends. Browsers keep the password for this folder
# only, so it never reaches the OAuth endpoints.
location /auth/proxy/ {
    include conf.d/include/proxy.conf;
    # Password guessing: a few attempts per minute and address (npm/http_top.conf); more get 429.
    limit_req            zone=pdn_sign_in burst=5 nodelay;
    limit_req_status     429;
    auth_basic           "PaperDotNet";
    auth_basic_user_file /data/access/ACCESS_LIST_ID;
    # The password stays at the proxy; PaperDotNet gets the name.
    proxy_set_header Authorization       "";
    proxy_set_header X-PaperDotNet-Proxy "PROXY_SECRET";
    proxy_set_header Remote-User         $remote_user;
    # Groups per user (npm/http_top.conf).
    proxy_set_header Remote-Groups       $pdn_groups;
}
