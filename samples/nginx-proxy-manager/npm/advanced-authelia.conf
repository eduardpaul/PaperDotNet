# PaperDotNet behind Nginx Proxy Manager, sign-in with Authelia (users, groups, e-mail, two-factor).
# Paste into the PaperDotNet proxy host: Edit Proxy Host > Advanced > Custom Nginx Configuration.
#
# - NPM must reach Authelia as http://authelia:9091 (same Docker network, profile "authelia").
# - Leave the proxy host's Access List at "Publicly Accessible".
# - This config has its own default location, so NPM leaves out its own (and the options it adds there).

# Authelia's authorization endpoint for nginx's sub-requests; clients cannot call it (internal).
location /internal/authelia/authz {
    internal;
    set $pdn_authelia http://authelia:9091/api/authz/auth-request;
    proxy_pass $pdn_authelia;
    proxy_set_header X-Original-Method $request_method;
    proxy_set_header X-Original-URL    $scheme://$http_host$request_uri;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header Content-Length    "";
    proxy_set_header Connection        "";
    proxy_pass_request_body off;
    proxy_http_version 1.1;
    proxy_buffers 4 32k;
}

# Sign-in (ADR-0031): the only place where PaperDotNet reads the proxy's headers, and the only place
# that goes through Authelia. PaperDotNet's routes ignore case and a trailing slash, so this location
# does too.
location ~* ^/connect/authorize/?$ {
    include conf.d/include/proxy.conf;
    auth_request /internal/authelia/authz;
    auth_request_set $pdn_user   $upstream_http_remote_user;
    auth_request_set $pdn_groups $upstream_http_remote_groups;
    auth_request_set $pdn_name   $upstream_http_remote_name;
    auth_request_set $pdn_email  $upstream_http_remote_email;
    proxy_set_header Remote-User   $pdn_user;
    proxy_set_header Remote-Groups $pdn_groups;
    proxy_set_header Remote-Name   $pdn_name;
    proxy_set_header Remote-Email  $pdn_email;
    # Not signed in at Authelia: send the browser to its portal, which comes back here afterwards.
    auth_request_set $pdn_redirect $upstream_http_location;
    error_page 401 =302 $pdn_redirect;
}

# The other OAuth endpoints (token, userinfo, logout, revoke): no proxy identity.
location ~* ^/connect/ {
    include conf.d/include/proxy.conf;
    proxy_set_header Remote-User   "";
    proxy_set_header Remote-Groups "";
    proxy_set_header Remote-Name   "";
    proxy_set_header Remote-Email  "";
}

# Live events (server-sent events) and MCP: pass each event on at once and keep quiet streams open.
location ~* ^/v1\.0/(me/events|mcp)(/|$) {
    include conf.d/include/proxy.conf;
    proxy_buffering    off;
    proxy_cache        off;
    proxy_read_timeout 1h;
}

# Everything else: web UI, API, uploads. Requests authenticate with tokens; nobody can name a user here.
location / {
    include conf.d/include/proxy.conf;
    proxy_set_header Remote-User   "";
    proxy_set_header Remote-Groups "";
    proxy_set_header Remote-Name   "";
    proxy_set_header Remote-Email  "";
}
