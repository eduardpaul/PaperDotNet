# PaperDotNet behind Nginx Proxy Manager, sign-in with Authelia (users, groups, e-mail, two-factor).
# Paste into the PaperDotNet proxy host: Edit Proxy Host > Advanced > Custom Nginx Configuration, then replace
# PROXY_SECRET with PROXY_SECRET from .env.
# - NPM must reach Authelia as http://authelia:9091 (same Docker network, profile "authelia").
# - Leave the proxy host's Access List at "Publicly Accessible".

# Uploads: the largest request PaperDotNet takes is a 512 MB template package (documents: 100 MB by default).
# NPM's own limit is 2000 MB; anything above this is refused before NPM buffers it to disk.
client_max_body_size 520m;

# Authelia's authorization endpoint for nginx's sub-requests; clients cannot call it (internal).
location /internal/authelia/authz {
    internal;
    set $pdn_authelia http://authelia:9091/api/authz/auth-request;
    proxy_pass $pdn_authelia;
    proxy_set_header X-Original-Method $request_method;
    proxy_set_header X-Original-URL    $scheme://$http_host$request_uri;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header Content-Length    "";
    proxy_set_header Connection        "";
    proxy_pass_request_body off;
    proxy_http_version 1.1;
    proxy_buffers 4 32k;
}

# Sign-in (ADR-0045): the only path that goes through Authelia. PaperDotNet sends signed-out browsers here and
# trusts the user headers only with the secret, which only this location sends.
location /auth/proxy/ {
    include conf.d/include/proxy.conf;
    auth_request /internal/authelia/authz;
    auth_request_set $pdn_user   $upstream_http_remote_user;
    auth_request_set $pdn_groups $upstream_http_remote_groups;
    auth_request_set $pdn_name   $upstream_http_remote_name;
    auth_request_set $pdn_email  $upstream_http_remote_email;
    proxy_set_header X-PaperDotNet-Proxy "PROXY_SECRET";
    proxy_set_header Remote-User         $pdn_user;
    proxy_set_header Remote-Groups       $pdn_groups;
    proxy_set_header Remote-Name         $pdn_name;
    proxy_set_header Remote-Email        $pdn_email;
    # Not signed in at Authelia: send the browser to its portal, which comes back here afterwards.
    auth_request_set $pdn_redirect $upstream_http_location;
    error_page 401 =302 $pdn_redirect;
}
