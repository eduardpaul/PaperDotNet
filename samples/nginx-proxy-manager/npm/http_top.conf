# Http-level settings for npm/advanced-access-list.conf (sign-in with an NPM access list); required by it.
# compose.yml mounts this file at /data/nginx/custom/http_top.conf; with your own NPM, put it there and restart NPM.
# NPM includes that file in its http block. Authelia mode does not need it (Authelia bans repeated failures itself).

# Sign-in attempts per client address: 6 per minute (bursts of 5), shared by all access-list sign-ins.
limit_req_zone $binary_remote_addr zone=pdn_sign_in:10m rate=6r/m;

# Groups per access-list user, sent as Remote-Groups at sign-in. Comma-separated group names: PaperDotNet adds the
# user to these groups (CREATE_GROUPS creates missing ones) and, with GROUP_SYNC=Sync, removes them from proxy
# groups no longer listed.
map $remote_user $pdn_groups {
    default "";
    admin   "Admins";
    alice   "Finance";
}
