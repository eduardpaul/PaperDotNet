# Http-level settings for npm/advanced-access-list.conf (sign-in with an NPM access list).
# compose.yml mounts this file at /data/nginx/custom/http_top.conf; with your own NPM, put it there.
# NPM includes that file in its http block. Authelia mode does not need it.

# Groups per access-list user, sent as Remote-Groups at sign-in (comma-separated). PaperDotNet adds
# the user to existing groups of these names; it never creates groups or removes members.
map $remote_user $pdn_groups {
    default "";
    admin   "Admins";
    alice   "Finance";
}

# Browsers send the access list's password again (Authorization: Basic) to every path below /connect/,
# the folder of the sign-in URL. OpenIddict would read it as client credentials and reject the web UI's
# token request. Requests from browsers carry Sec-Fetch-Site; server-side OAuth clients do not, so their
# own Basic client credentials still pass.
map "$http_sec_fetch_site|$http_authorization" $pdn_connect_authorization {
    "~*^[^|]+\|basic "  "";
    default             $http_authorization;
}
