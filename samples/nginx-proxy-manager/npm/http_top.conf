# Groups per NPM access-list user, for npm/advanced-access-list.conf (sent as Remote-Groups at sign-in).
# compose.yml mounts this file at /data/nginx/custom/http_top.conf; with your own NPM, put it there and restart NPM.
# NPM includes that file in its http block. Authelia mode does not need it.
#
# Comma-separated group names. PaperDotNet adds the user to these groups (CREATE_GROUPS creates missing ones) and,
# with GROUP_SYNC=Sync, removes them from proxy groups no longer listed.
map $remote_user $pdn_groups {
    default "";
    admin   "Admins";
    alice   "Finance";
}
