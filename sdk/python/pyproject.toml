[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paperdotnet-client"
version = "0.1.0"
description = "Typed Python client for the PaperDotNet API (generated with Kiota from sdk/openapi.json)."
license = "Apache-2.0"
requires-python = ">=3.9"
dependencies = ["microsoft-kiota-bundle>=1.14,<2", "httpx>=0.28"]

[tool.setuptools.packages.find]
include = ["paperdotnet_client*"]
